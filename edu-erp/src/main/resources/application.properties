spring.application.name=edu-erp

# Conexão com o Postgres (subido via docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/eduerp
spring.datasource.username=eduerp
spring.datasource.password=eduerp

# JPA/Hibernate
# validate: nunca deixe o Hibernate criar/alterar tabelas sozinho.
# Quem manda no schema é o Flyway (migrations versionadas).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
